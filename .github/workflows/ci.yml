name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.3

      - name: Cache Bun packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.3-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Source checks are independent; package loading requires the build below.
      - parallel:
          - name: Formatting and lint
            run: bun run format:check && bun run lint
          - name: Type check
            run: bun run typecheck
          - name: Test
            run: bun run test
          - name: Audit
            run: bun audit
      - name: Build and verify package
        run: bun run build && bun run test:package
