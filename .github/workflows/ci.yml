name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release metadata guard
        run: node --test scripts/check-release-guard.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.4-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.4.4-

      - name: Install dependencies
        run: bun ci

      # Source checks are independent; package loading requires the build below.
      - parallel:
          - name: Formatting
            run: bun run format:check
          - name: Bun check
            run: bun run typecheck
          - name: Test
            run: bun run test
          - name: Audit
            run: bun audit
      - name: Build and verify package
        run: bun run build:artifacts && bun run test:package
